server:
  port: 8082

spring:
  application:
    name: booth-product
  config:
    import:
      - classpath:booth-common.yml
      - classpath:booth-mybatis.yml
      - optional:nacos:booth-product.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 15000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/booth_product?characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USER:booth}
    password: ${MYSQL_PASSWORD:booth123}
    hikari:
      maximum-pool-size: 40
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

booth:
  order:
    # 没单独配置时宁可等满一天再对账。比交易服务更早释放，顾客还可能付款，库存却已经卖给别人
    pay-timeout: ${BOOTH_ORDER_PAY_TIMEOUT:24h}
