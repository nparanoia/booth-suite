server:
  port: 8081

spring:
  application:
    name: booth-user
  config:
    import:
      - classpath:booth-common.yml
      - classpath:booth-mybatis.yml
      - classpath:booth-satoken.yml
      - optional:nacos:booth-user.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 15000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/booth_user?characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USER:booth}
    password: ${MYSQL_PASSWORD:booth123}
    hikari:
      maximum-pool-size: 40
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
