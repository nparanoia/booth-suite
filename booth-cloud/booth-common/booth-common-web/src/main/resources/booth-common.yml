# 各服务通过 spring.config.import: classpath:booth-common.yml 引入的共享配置
spring:
  config:
    import:
      - classpath:booth-security.yml
      - classpath:booth-observe.yml
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

springdoc:
  api-docs:
    # 默认关；本机联调在 deploy/.env 设 API_DOCS_ENABLED=true（见 SECURITY.md）
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
